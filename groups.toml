# Installable groups. ./scripts/install.sh --group <name> installs a whole group.
#
# Every skill directory must appear in exactly one group for its tree; the
# validator fails otherwise, so this file cannot silently drift from the tree.
#
# One [[group]] entry per (tree, group). Keep the structure flat and one skill
# per line: this file is read both by Python's tomllib and by awk in the
# installer.

[[group]]
name = "agents"
tree = "claude"
description = "Building and shipping agents with Google's ADK — core dev loop, A2A protocol, Agent Engine deployment. Start at adk."
skills = [
  "adk",
  "a2a",
  "agent-engine",
  "agent-development",
]

[[group]]
name = "workflow"
tree = "claude"
description = "The plan-then-execute development loop: write a plan, execute it, hand work to subagents, run the code-review round trip, and land the branch. Start at writing-plans."
skills = [
  "writing-plans",
  "executing-plans",
  "subagent-driven-development",
  "requesting-code-review",
  "receiving-code-review",
  "finishing-a-development-branch",
  "git-worktrees",
  "ralph-wiggum",
  "modern-python",
]

