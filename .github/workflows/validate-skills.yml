name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Repo-wide SKILL.md validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate every SKILL.md in claude/ and gemini/
        run: uv run scripts/validate-skills.py

      # Bundle-specific checks (required sections, line-count limits) for the
      # vendored Trail of Bits skills. Ten of these skills currently exceed the
      # bundle's own 500-line limit; that predates this workflow, so the step
      # reports without failing the build. Drop continue-on-error once the
      # over-length skills are split.
      - name: Validate testing-handbook bundle (non-blocking)
        continue-on-error: true
        working-directory: claude/testing-handbook-skills
        run: uv run scripts/validate-skills.py
