name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Repo-wide SKILL.md validation
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. The default shallow clone cannot resolve
      # origin/main..HEAD, so the attribution check below would find no commits
      # and pass silently rather than fail.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No agent attribution in commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git rev-parse --verify -q "$BASE^{commit}" >/dev/null; then
            echo "No usable base ref ($BASE); skipping commit scan."; exit 0
          fi
          offenders=$(git log --format='%H %s%n%b' "$BASE..$HEAD" \
            | grep -inE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude code' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Commit messages contain agent attribution:"
            echo "$offenders"
            echo "Fix: git rebase -i $BASE and remove the trailer, then force-push with --force-with-lease."
            echo "See CODE_STANDARDS.md."
            exit 1
          fi
          echo "Commit messages clean."

      - name: No agent attribution in the PR description
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The PR body is not in git, so the commit scan above cannot see it.
          body=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.body // ""')
          offenders=$(printf '%s' "$body" \
            | grep -inE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude code|🤖' || true)
          if [ -n "$offenders" ]; then
            echo "::error::PR description contains agent attribution:"
            echo "$offenders"
            echo "Fix: gh pr edit $PR --body '<text without the footer>'. See CODE_STANDARDS.md."
            exit 1
          fi
          echo "PR description clean."

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The validator is the gate for everything below, and until now nothing
      # tested it. These run first: a broken check reports nothing and the
      # skill validation below would pass for the wrong reason.
      - name: Test the validators
        run: uv run --group dev pytest

      # line-length lives in pyproject.toml and is 100, matching what the code
      # already was. At ruff's default 88 this step would rewrap ~100 lines on
      # first run; at 100 it reformatted 13.
      - name: Lint and format
        run: |
          uvx ruff check scripts/ tests/
          uvx ruff format --check scripts/ tests/

      # scripts/ only, and with an explicit search path. A bare `ty check` walks
      # into the skills and reports ~34 diagnostics in vendored helper scripts we
      # do not own; scripts/ is a flat directory of sibling modules, so without
      # --extra-search-path every cross-script import is unresolved.
      - name: Type-check
        run: uv run --group dev ty check --extra-search-path scripts scripts/

      - name: Validate every SKILL.md in claude/ and gemini/
        run: uv run scripts/validate-skills.py

      # The stated-count and catalogue-membership checks run inside the step
      # above; this one covers the other tier — the README tables that are
      # generated rather than validated. --check regenerates in memory, diffs,
      # and never writes, so a stale table fails here instead of shipping.
      - name: README generated tables match the tree
        run: uv run scripts/sync-docs.py --check

      # Bundle-specific checks (required per-type sections, Hugo shortcodes) for
      # the vendored Trail of Bits skills, which the repo-wide validator leaves
      # to this script.
      - name: Validate testing-handbook bundle
        working-directory: claude/testing-handbook-skills
        run: uv run scripts/validate-skills.py

      - name: Validate testing-handbook bundle (Gemini tree)
        working-directory: gemini/testing-handbook-skills
        run: uv run scripts/validate-skills.py
